name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    name: Check + Lint + Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check code compiles
        run: cargo check --manifest-path terminal/Cargo.toml
      - name: Run Clippy (lints)
        run: cargo clippy --manifest-path terminal/Cargo.toml -- -D warnings
      - name: Check code formatting
        run: cargo fmt --manifest-path terminal/Cargo.toml -- --check
  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build optimized release
        run: cargo build --release --manifest-path terminal/Cargo.toml
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusportal-linux
          path: terminal/target/release/nexusportal